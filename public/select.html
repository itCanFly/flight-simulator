<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Level Selection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 50%, #0f172a 100%);
            margin: 0;
            padding: 0;
            overflow: hidden;
            color: white;
        }

        /* Level Selection */
        #levelSelection {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            z-index: 80;
            justify-content: center;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
        }

        .levels-title {
            font-size: 3rem;
            font-weight: bold;
            text-align: center;
            margin-bottom: 2rem;
        }

        .levels-container {
            background: rgba(30, 41, 59, 0.9);
            border-radius: 20px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            align-items: center;
        }

        .level-card {
            width: 280px;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 1.5rem 2rem;
            border: 2px solid rgba(51, 65, 85, 0.6);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .level-card:hover {
            border-color: #3b82f6;
            transform: translateY(-5px);
        }

        .level-name {
            font-size: 1.8rem;
            font-weight: bold;
        }

        .back-button {
            position: absolute;
            top: 2rem;
            left: 2rem;
            padding: 0.8rem 1.5rem;
            font-size: 1.2rem;
            background: rgba(51, 65, 85, 0.8);
            color: white;
            border: 2px solid rgba(71, 85, 105, 0.8);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .back-button:hover {
            background: rgba(71, 85, 105, 0.9);
            transform: translateX(-5px);
        }
    </style>
</head>
<body>
    <div id="levelSelection">
        <div class="levels-container">
            <button class="back-button" id="backToMenuButton">← Back</button>
            <div class="levels-title">Select Level</div>
            <div class="level-card" data-level="1">
                <div class="level-name">Level 1</div>
            </div>
            <div class="level-card" data-level="2">
                <div class="level-name">Level 2</div>
            </div>
            <div class="level-card" data-level="3">
                <div class="level-name">Level 3</div>
            </div>
        </div>
    </div>
    
    <script type="module" src="../src/main.js"></script>

</body>
</html>
